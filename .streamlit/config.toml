[server]
# Отключает автоматическую перезагрузку при изменении кода
# Это уберет нагрузку на Watchdog и WinAPI
folderWatchBlacklist = ["*"]
fileWatcherType = "none"

# Дополнительно можно настроить запуск, чтобы не открывался браузер автоматически
headless = true

# Раздача файлов из src/static/ по адресу app/static/... - нужна для своих
# шрифтов (см. [[theme.fontFaces]] ниже)
enableStaticServing = true

[client]
# Меню оставляем только для системных сообщений (ошибки, статус) - пункты
# разработчика ("Print", "Made with Streamlit") из него уходят
toolbarMode = "minimal"

# ==========================================
# ТЕМА: фирменный стиль Национального геопортала
# ==========================================
# Цвета сняты с сайта геопортала (пикселями со скриншота главной страницы):
#   #4590C9 - кнопка "Регистрация", активный пункт меню
#   #42484F - основной текст, #4E5D73 - подписи
#   #F3F7FD..#DEE5F1 - светло-голубой фон
# Тема закреплена светлой: переключатель темы живёт в меню Streamlit, которое
# скрыто вместе с верхней полосой (см. _GLOBAL_CSS в app.py).
[theme]
base = "light"

# Акцент: оттенок #4590C9, затемнённый до контраста 4.5:1 с белым текстом
# (у самого #4590C9 - 3.45:1, подписи на кнопках читались бы хуже).
# Используется на основных кнопках, активной вкладке, ссылках, фокусе полей.
# Если цвет меняется - поменять и спиннер оверлея в _GLOBAL_CSS (app.py).
primaryColor = "#347BB2"
linkColor = "#347BB2"
blueColor = "#347BB2"
# Плашки st.info и синие бейджи: без явных значений Streamlit выводит их из
# blueColor, и подсказка получалась серой. Текст к фону - контраст 5:1.
blueBackgroundColor = "#E1EDF7"
blueTextColor = "#2B6797"

# Фон страницы белый: плотные таблицы на нём читаются лучше, а закреплённые
# шапка и панели в app.py тоже белые. Голубой оттенок сайта - во второстепенном
# фоне (поля ввода, шапки таблиц, блоки кода).
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EEF3F9"
textColor = "#42484F"
borderColor = "#D5DEEA"
showWidgetBorder = true

dataframeHeaderBackgroundColor = "#EEF3F9"
dataframeBorderColor = "#D5DEEA"

# Кнопки-"пилюли", как на сайте; остальные элементы - умеренное скругление
baseRadius = "medium"
buttonRadius = "full"

# Шрифты: Montserrat - заголовки (как "Национальный геопортал" на сайте),
# Inter - текст (узкий и чёткий в таблицах). Хранятся в src/static/fonts,
# чтобы не зависеть от доступа браузеров пользователей к Google Fonts.
font = "Inter"
headingFont = "Montserrat"
# Inter шире шрифта Streamlit по умолчанию: при 15-16 px подписи кнопок
# в шапке ("Админ-панель") переносились на вторую строку
baseFontSize = 14
headingFontWeights = [700, 700, 600, 600, 600, 600]

# Файлы - вариативные woff2 из @fontsource-variable 5.3.0 (лицензия OFL-1.1,
# тексты лицензий рядом со шрифтами). Два подмножества на шрифт: кириллица
# (включая белорусские і, ў и знак №) и латиница с пунктуацией. Символы вне
# диапазонов (например, стрелка →) берутся из системного шрифта.
[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-cyrillic-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"

[[theme.fontFaces]]
family = "Inter"
url = "app/static/fonts/inter-latin-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-cyrillic-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116"

[[theme.fontFaces]]
family = "Montserrat"
url = "app/static/fonts/montserrat-latin-wght-normal.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"
