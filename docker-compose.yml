version: '3.8'

services:
  db:
    image: postgres:16
    container_name: geodata_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data # Персистентное хранилище БД
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro # Авто-создание схемы при первом запуске
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
  #  ports:
  #    - "5432:5432" # Только для отладки! Удалите в продакшене'''

  app:
    build: .
    container_name: geodata_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
      PYTHONUNBUFFERED: "1"
      SESSION_DIR: "/app/app_data/sessions"
    volumes:
      - ./app_data:/app/app_data
      - ./:/app
    ports:
      - "8501:8501"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
    #dns:
    #  - 8.8.8.8
  nginx:
    image: nginx:alpine
    container_name: geodata_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - app_net
  
  db-backup:
    build: ./backup
    container_name: geodata_db_backup
    env_file: .env
    environment:
      - PGPASSWORD=${DB_PASS}
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_NAME=${DB_NAME}
      - DB_PORT=5432
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - app_net

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
    driver: local