services:
  db:
    image: postgres:16-alpine
    container_name: geodata_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "local"
      options: { max-size: "5m", max-file: "3" }

  app:
    build: .
    container_name: geodata_app
    restart: unless-stopped
    env_file: .env.prod
    environment:
      DB_HOST: db
      DB_PORT: 5432
      PYTHONUNBUFFERED: "1"
      SESSION_DIR: "/app/app_data/sessions"
    volumes:
      - ./app_data:/app/app_data
    networks:
      - app_net
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "local"
      options: { max-size: "10m", max-file: "5" }

  nginx:
    image: nginx:alpine
    container_name: geodata_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - app_net
    logging:
      driver: "local"
      options: { max-size: "5m", max-file: "3" }

  db-backup:
    build: ./backup
    container_name: geodata_db_backup
    env_file: .env.prod
    environment:
      PGPASSWORD: ${DB_PASS}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
    volumes:
      - ./backups:/backups
    restart: unless-stopped
    networks:
      - app_net
    logging:
      driver: "local"
      options: { max-size: "2m", max-file: "2" }

networks:
  app_net:
    driver: bridge

volumes:
  pgdata:
    #driver: local